[tool.ruff]
exclude =[
    ".venv",
    ".git",
    "__pycache__",
    "_archive",
    "gui/__Deprecated",
    "maccre_core/orchestration/__Deprecated",
    "Sovereign-Auth-Drop"
]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that require network or long execution",
    "integration: marks tests that touch real filesystem/database",
]

[tool.pyright]
exclude =[
    "**/node_modules",
    "**/__pycache__",
    "_archive",
    ".venv",
    "gui/__Deprecated",
    "maccre_core/orchestration/__Deprecated",
    "Sovereign-Auth-Drop"
]
